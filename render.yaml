services:
  - type: web
    name: prefecture-quiz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_ID
        value: teacher
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: 1
