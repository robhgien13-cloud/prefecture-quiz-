<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>47都道府県 毎日10問</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#173348;font-family:system-ui,"Noto Sans JP",sans-serif}main{max-width:820px;margin:auto;padding:20px}section{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 2px 12px #0001}h1{font-size:25px}h2{font-size:20px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #b7cbd6;width:100%;margin-top:6px}button{background:#11765c;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e5eff3;color:#123}small{color:#536a7a}.hidden{display:none}.hint{padding:12px;background:#eff7f5;border-radius:9px;margin:8px 0}.error{color:#a32}.success{color:#08764d}#map-note{padding:12px;border:1px dashed #9aa;line-height:1.7}#feedback{padding:14px;background:#eef4f7;border-radius:10px;margin-top:12px}
</style></head><body><main><h1>🗾 47都道府県 毎日10問</h1><small>調べながらOK｜番号・地方・県名の3つがすべて正解ならクリア</small><section id="login"><h2>ログイン</h2><label>ログインID<input id="user" autocomplete="username"></label><label id="passLabel">先生用パスワード（生徒は空欄）<input id="pass" type="password" autocomplete="current-password"></label><button id="loginBtn">ログイン</button><p id="loginError" class="error"></p></section>
<div id="app" class="hidden"><section><div id="who"></div><button class="secondary" id="logout">ログアウト</button></section>
<section id="student" class="hidden"><h2 id="progress">今日の問題</h2><div id="quiz"></div><div id="feedback"></div><button id="next" class="secondary hidden">次の問題へ</button></section>
<section id="teacher" class="hidden"><h2>先生用管理画面</h2><label>新しい生徒ID（英数字3〜30文字）<input id="newUser"></label><button id="addUser">生徒IDを登録</button><p id="createResult"></p><h2>本日の学習状況</h2><button class="secondary" id="refresh">更新</button><div id="stats"></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let state=null,pos=0,shown=1;
async function api(path,options={}){const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...options});const v=await r.json();if(!r.ok)throw Error(v.error||'通信エラー');return v}
function post(path,obj){return api(path,{method:'POST',body:JSON.stringify(obj)})}
function message(id,text){$(id).textContent=text}
async function login(){try{const v=await post('login',{username:$('user').value,password:$('pass').value});$('login').classList.add('hidden');$('app').classList.remove('hidden');message('who',v.username+'（'+(v.role==='teacher'?'先生':'生徒')+'）');if(v.role==='teacher'){$('teacher').classList.remove('hidden');await refresh()}else{$('student').classList.remove('hidden');await load()}}catch(e){message('loginError',e.message)}}
$('loginBtn').onclick=login;
$('logout').onclick=async()=>{await post('logout',{});location.reload()};
async function load(){state=await api('today');pos=0;while(pos<state.questions.length&&state.questions[pos].answer)pos++;render()}
function render(){const q=state.questions[pos];$('next').classList.add('hidden');$('feedback').textContent='';message('progress','本日の進捗：'+state.questions.filter(x=>x.answer).length+' / 10問');if(!q){$('quiz').innerHTML='<h2>本日の10問が終了しました！</h2><p>また明日挑戦しましょう。</p>';return}shown=1;const el=$('quiz');el.innerHTML='<h2>第'+(pos+1)+'問</h2><div id="hints"></div><button class="secondary" id="more">次のヒントを見る</button><div id="map-note"><b>地図番号を確認</b><p>手元の番号付き都道府県地図を見て答えましょう。地図画像のアプリ内表示は調整中です。</p></div><label>① 地図の番号（1〜47）<input id="number" type="number" min="1" max="47" inputmode="numeric"></label><label>② 地方区分<select id="region"><option value="">選択してください</option></select></label><label>③ 都道府県名<select id="name"><option value="">先に地方を選んでください</option></select></label><button id="check">答え合わせ</button>';state.regions.forEach((r,i)=>$('region').add(new Option(r,i)));$('region').onchange=()=>{const n=$('name');n.innerHTML='<option value="">選択してください</option>';state.options.filter(x=>String(x.region)===$('region').value).forEach(x=>n.add(new Option(x.name,x.name)))};$('more').onclick=()=>{shown=Math.min(3,shown+1);renderHints(q)};$('check').onclick=()=>check(q);renderHints(q)}
function renderHints(q){$('hints').innerHTML='';q.hints.slice(0,shown).forEach((h,i)=>{const div=document.createElement('div');div.className='hint';div.textContent='ヒント'+(i+1)+'：'+h;$('hints').appendChild(div)});$('more').disabled=shown===3}
async function check(q){try{if(!$('number').value||$('region').value===''||!$('name').value)throw Error('3つすべて回答してください');const r=await post('answer',{id:q.id,number:$('number').value,region:$('region').value,name:$('name').value,hints:shown});q.answer=r;message('feedback',(r.correct?'🎉 3つとも正解！':'正解は '+r.actual+'（地図番号 '+r.actualNumber+'）')+'　獲得 '+r.score+' 点');$('check').disabled=true;$('more').disabled=true;$('next').classList.remove('hidden');$('next').onclick=()=>{pos++;while(pos<state.questions.length&&state.questions[pos].answer)pos++;render()}}catch(e){message('feedback',e.message)}}
$('addUser').onclick=async()=>{try{await post('admin/students',{username:$('newUser').value});message('createResult','生徒IDを登録しました');await refresh()}catch(e){message('createResult',e.message)}};
async function refresh(){try{const r=await api('admin/stats');const root=$('stats');root.innerHTML='';r.students.forEach(s=>{const p=document.createElement('p');p.textContent=s.username+'：'+s.answered+'/10問　正解'+s.correct+'問　'+s.score+'点';root.appendChild(p)})}catch(e){message('stats',e.message)}}$('refresh').onclick=refresh;
</script></body></html>
